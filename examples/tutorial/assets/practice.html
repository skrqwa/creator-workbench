<!DOCTYPE html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>选题簿 · 录屏练习</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#161e1d;background:#f1f0ea;font:20px "Microsoft YaHei","PingFang SC",sans-serif}main{width:min(100%,1152px);margin:auto;padding:32px 64px}
header{display:flex;align-items:center;gap:20px;border-bottom:1px solid #bbbfb4;padding:0 0 19px}h1{margin:0;font-size:44px;letter-spacing:.04em}header span{margin-left:auto;color:#626d66;font-size:17px}.mark{width:39px;height:43px;background:#dc6244;transform:rotate(-7deg);border:6px double #f1f0ea}
form{display:flex;gap:10px;margin:25px 0 18px}input,button{font:inherit}input{min-width:0;padding:12px 16px;background:#fffef9;color:#18221c;border:1px solid #bdc3b6;border-radius:5px}#new{flex:1}button{border:0;cursor:pointer}.save{background:#214a3f;color:white;padding:12px 26px;border-radius:5px}
nav{display:flex;align-items:center;gap:7px;margin-top:20px}.tab{padding:8px 18px;border-radius:3px;background:transparent;color:#4f5b53}.tab.active{background:#dbe4d8;color:#123b2b;font-weight:bold}#search{margin-left:auto;width:210px;padding:8px 12px;font-size:18px}ul{list-style:none;margin:11px 0 0;padding:0}li{height:67px;display:flex;align-items:center;gap:16px;border-bottom:1px solid #cbd0c4;background:#f8f8f1;padding:12px 17px}li::before{content:"";height:17px;width:4px;background:#adbd9e}li strong{font-weight:500}.tag{margin-left:auto;border:1px solid #c8cbbf;color:#46544b;background:#eeefe7;padding:4px 13px;border-radius:16px;font-size:16px}.tag.on{background:#e9dace;color:#824c35;border-color:#dfc9b7}footer{margin-top:11px;color:#70776c;font-size:16px}
</style>
<main>
  <header><i class="mark"></i><h1>选题簿</h1><span>我的写作笔记</span></header>
  <form><input id="new" maxlength="80" placeholder="记下一条新选题" aria-label="新选题"><button class="save">保存</button></form>
  <nav><button type="button" class="tab active" data-filter="all">全部</button><button type="button" class="tab" data-filter="queued">待写</button><input id="search" placeholder="搜索标题" aria-label="搜索标题"></nav>
  <ul aria-label="选题清单"></ul><footer></footer>
</main>
<script>
const defaults=[{title:"旧相机里的城市散步",queued:false},{title:"一间书店的日常",queued:true},{title:"雨后骑行路线",queued:false}];
let rows,filter="all";
try { rows=JSON.parse(localStorage.getItem("notebook-exercise"))||defaults; } catch { rows=defaults; }
function draw(){
  const term=document.querySelector("#search").value.trim(), list=document.querySelector("ul");
  const visible=rows.filter(row=>(filter==="all"||row.queued)&&row.title.includes(term));
  list.replaceChildren();
  for(const row of visible){
    const item=document.createElement("li"), title=document.createElement("strong"), tag=document.createElement("button");
    title.textContent=row.title; tag.type="button"; tag.textContent=row.queued?"待写":"加为待写";
    tag.className="tag"+(row.queued?" on":"");
    tag.onclick=()=>{row.queued=!row.queued;save();};
    item.append(title,tag);list.append(item);
  }
  document.querySelector("footer").textContent="共 "+visible.length+" 条选题";
}
function save(){try{localStorage.setItem("notebook-exercise",JSON.stringify(rows));}catch{} draw();}
document.querySelector("form").onsubmit=event=>{
  event.preventDefault();const input=document.querySelector("#new");if(!input.value.trim())return;
  rows.unshift({title:input.value.trim(),queued:false});input.value="";save();
};
document.querySelectorAll(".tab").forEach(tab=>tab.onclick=()=>{
  filter=tab.dataset.filter;document.querySelectorAll(".tab").forEach(item=>item.classList.toggle("active",item===tab));draw();
});
document.querySelector("#search").oninput=draw;
draw();
</script>
</html>
